# Builds 3D previews for STEP files under cad/ and (optionally) publishes the viewer site.
#
#  previews job : finds STEP files whose content changed (using the hash in each
#                 Git LFS pointer), downloads only those from LFS, meshes them to
#                 STL with CadQuery, updates previews/manifest.json and commits.
#  site job     : converts previews to GLB and deploys the viewer to GitHub Pages.
#                 It only runs if the repo variable ENABLE_PAGES is "true".
#                 NOTE: a Pages site can be public even when the repo is private,
#                 unless you're on GitHub Enterprise Cloud. Check before enabling.
name: CAD previews

on:
  push:
    branches: [main]
    paths: ["cad/**", "site/**", "scripts/**", ".github/workflows/previews.yml"]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild every preview, not just changed ones"
        type: boolean
        default: false

permissions:
  contents: write   # commit updated previews
  pages: write
  id-token: write

concurrency:
  group: cad-previews
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"   # never auto-download LFS files; we pull only what's needed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the per-part revision list
          lfs: false       # don't download every CAD file; see below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install CadQuery
        run: pip install -r scripts/requirements.txt

      - name: Find stale previews
        id: plan
        run: |
          python scripts/convert.py plan ${{ inputs.rebuild_all && '--all' || '' }} > stale.txt
          echo "Stale STEP files:"; cat stale.txt
          echo "count=$(grep -c . stale.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Download changed STEP files from LFS
        if: steps.plan.outputs.count != '0'
        run: |
          git lfs install --local
          # Pull in batches so very long path lists don't hit command-line limits
          xargs -a stale.txt -d '\n' -n 50 sh -c 'git lfs pull --include="$(printf "%s," "$@" | sed "s/,$//")"' _

      - name: Build previews and manifest
        run: python scripts/convert.py build ${{ inputs.rebuild_all && '--all' || '' }}

      - name: Commit previews
        run: |
          git config user.name  "cad-previews[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A previews
          if git diff --cached --quiet; then
            echo "Previews already up to date."
          else
            git commit -m "Update CAD previews [skip ci]"
            git pull --rebase --autostash origin main   # in case someone pushed meanwhile
            git push
          fi

  site:
    needs: previews
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main      # pick up the previews commit made by the job above
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
